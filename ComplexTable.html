<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Table Html</title>
</head>


         

         <style>
              
                    th{
                          text-align: center; color: rgb(171, 23, 174);

                    }
         </style>
   
<body>
        <table align="center" border="2" cellpadding="5" width="50%">
                <tr>
                      <th rowspan="2"> </th>
                      <th colspan="2"> Average </th>
                      <th rowspan="2">  Red Eye</th>
                </tr>
                 <tr>
                       <td> Height</td>
                       <td> Weight </td>
                 </tr>
                  <tr>  
                       <td> males </td>
                       <td> 1.9 </td>
                       <td> 0.003 </td>
                       <td> 40% </td>
                  </tr>
                   <tr>
                     <td> Femals </td>
                      <td> 1.7 </td>
                      <td> 0.002 </td>
                      <td> 43%</td>
                   </tr>
                     
                      
                     
        </table>
    
</body>
</html>
